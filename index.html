<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPEREUR NOCT∆MBULE</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070a;color:white;font-family:'Poppins',sans-serif;min-height:100vh}
.header{text-align:center;padding:25px 15px;border-bottom:3px solid #FFD700;background:#111;cursor:pointer}
.manga-title{font-family:'Bangers';font-size:48px;color:#FFD700;text-shadow:3px 3px 0 #000;letter-spacing:3px;line-height:0.9}
.manga-sub{font-size:10px;color:#888;letter-spacing:3px;margin-top:6px}
.container{max-width:420px;margin:0 auto;padding:20px}
.lock-box{background:linear-gradient(135deg,#111,#1a1a1a);border:2px solid #333;border-radius:16px;padding:22px;text-align:center;margin-top:15px}
.code-input{width:100%;padding:16px;border-radius:12px;border:2px solid #333;background:#000;color:#FFD700;text-align:center;font-weight:800;letter-spacing:4px;font-size:18px;outline:none}
.btn-verify{width:100%;margin-top:12px;padding:14px;background:#FFD700;color:black;border:none;border-radius:12px;font-weight:800}
.btn-contact{display:block;margin-top:12px;padding:14px;background:#25D366;color:white;text-align:center;border-radius:12px;font-weight:800;text-decoration:none;font-size:13px}
.buttons{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;justify-content:space-between;padding:16px 18px;border-radius:12px;border:2px solid;font-weight:800;text-decoration:none;color:white;text-transform:uppercase;font-size:13px}
.btn-spam{border-color:#ff3b30;background:#1a1a1a}
.btn-urgence{border-color:#FFD700;background:linear-gradient(135deg,#FFD700,#FFA500);color:black}
.btn-assist{border-color:#25D366;background:#111}
#contentLocked{display:none}
.footer{text-align:center;padding:25px;font-size:9px;color:#444}
#godPanel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:9999;padding:15px;overflow:auto}
.god-card{background:#111;border:2px solid #FFD700;border-radius:15px;padding:18px}
.god-card h1{font-family:'Bangers';font-size:32px;color:#FFD700;text-align:center}
.god-input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#000;color:white;margin:8px 0}
.god-btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;margin-top:8px}
.gen{background:#FFD700;color:black}
.code-item{display:flex;justify-content:space-between;background:#000;border:1px solid #222;border-radius:8px;padding:10px;margin:6px 0;font-size:12px}
.close{width:100%;padding:14px;background:#ff3b30;color:white;border:none;border-radius:10px;font-weight:800;margin-top:15px}
</style>
</head>
<body>
<div class="header" id="tapZone">
<div class="manga-title">EMPEREUR<br>NOCT∆MBULE</div>
<div class="manga-sub">DEV DAVIN NOCT∆MBULE • 05538087</div>
</div>
<div class="container">
<div id="lockScreen" class="lock-box">
<h2>🔒 ACCÈS PROTÉGÉ</h2>
<p>Entre ton code personnel.</p>
<input id="userCode" class="code-input" placeholder="EX: NOCT-A3F9">
<button class="btn-verify" onclick="verifyUserCode()">DÉVERROUILLER</button>
<a class="btn-contact" href="https://wa.me/24105538087">💬 JE N'AI PAS DE CODE</a>
</div>
<div id="contentLocked">
<div style="text-align:center;padding:15px;background:#111;border-radius:12px;border:1px solid #FFD700;margin-bottom:15px">
<p style="color:#FFD700;font-weight:800">✅ ACCÈS OK - <span id="codeUsed"></span></p>
</div>
<div class="buttons">
<a class="btn btn-spam" href="https://wa.me/24105538087?text=%F0%9F%9A%A8%20SPAM%20%3A%20">🚫 Signalement Spam →</a>
<a class="btn btn-urgence" href="https://wa.me/24105538087?text=%F0%9F%86%98%20URGENCE%20%3A%20">🆘 Signalement Urgence →</a>
<a class="btn btn-assist" href="https://wa.me/24105538087?text=%F0%9F%91%91%20ASSISTANCE%20%3A%20">💬 Assistance WhatsApp →</a>
</div>
</div>
</div>
<div class="footer">EMPEREUR NOCT∆MBULE © 2026</div>
<div id="godPanel">
<div class="god-card">
<h1>NIVEAU DIEU</h1>
<input id="clientName" class="god-input" placeholder="Nom client">
<input id="customCode" class="god-input" placeholder="Code perso ou vide auto">
<button class="god-btn gen" onclick="generateCode()">⚡ GÉNÉRER CODE</button>
<div id="lastGen" style="display:none;margin-top:12px;background:#000;border:1px dashed #FFD700;padding:12px;border-radius:10px;text-align:center">
<p id="lastCode" style="font-size:24px;color:#FFD700;font-weight:800"></p>
<button class="god-btn" style="background:#25D366;color:white" onclick="shareLastCode()">📲 WHATSAPP</button>
</div>
<div id="codeList" style="margin-top:15px"></div>
<button class="close" onclick="document.getElementById('godPanel').style.display='none'">FERMER</button>
</div>
</div>
<script>
const MASTER=['2410GOD','DEVDAVIN','9999','2410DEV','2410'];
const KEY='empereur_codes_v2';
let codes=JSON.parse(localStorage.getItem(KEY)||'[]');
let last=null;
function save(){localStorage.setItem(KEY,JSON.stringify(codes));render();}
function verifyUserCode(){
const v=document.getElementById('userCode').value.toUpperCase().trim();
if(MASTER.includes(v)||codes.find(c=>c.code===v)){
document.getElementById('lockScreen').style.display='none';
document.getElementById('contentLocked').style.display='block';
document.getElementById('codeUsed').textContent=v;
}else alert('❌ Code invalide');
}
function generateCode(){
const name=document.getElementById('clientName').value.trim()||'Client';
let code=document.getElementById('customCode').value.toUpperCase().trim();
if(!code){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<4;i++)r+=ch[Math.floor(Math.random()*ch.length)];code='NOCT-'+r;}
const o={code,client:name,created:new Date().toLocaleString()};codes.unshift(o);save();last=o;
document.getElementById('lastGen').style.display='block';document.getElementById('lastCode').textContent=code;
}
function shareLastCode(){
if(!last)return;const m=`👑 EMPEREUR NOCT∆MBULE - Ton code perso ${last.code}`;window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank');
}
function render(){
const d=document.getElementById('codeList');
d.innerHTML=codes.map((c,i)=>`<div class="code-item"><div><b style="color:#FFD700">${c.code}</b> - ${c.client}</div><button onclick="codes.splice(${i},1);save()" style="background:#ff3b30;color:white;border:none;padding:5px 8px;border-radius:5px">X</button></div>`).join('')||'Aucun code';
}
let t=0;document.getElementById('tapZone').addEventListener('click',()=>{t++;if(t>=5){document.getElementById('godPanel').style.display='block';render();t=0;}setTimeout(()=>t=0,3000);});render();
</script>
</body>
</html>
